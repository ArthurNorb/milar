name: milar-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: milar
      POSTGRES_PASSWORD: milar
      POSTGRES_DB: milar
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - milar-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milar -d milar"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  milar-dev-db:
