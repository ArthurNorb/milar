# /etc/nginx/sites-available/milar.conf  (link em sites-enabled)
#
# Milar atrás do Cloudflare (SSL "Full (strict)"), servido pelo Nginx que já
# existe na VPS. O app roda no Docker em 127.0.0.1:3010 (APP_PORT).
# Troque milararquitetura.com se o domínio for outro.

upstream milar_app {
    server 127.0.0.1:3010;
    keepalive 16;
}

# HTTP → HTTPS (o Cloudflare já redireciona; isto cobre acesso direto).
server {
    listen 80;
    listen [::]:80;
    server_name milararquitetura.com www.milararquitetura.com;
    return 301 https://milararquitetura.com$request_uri;
}

# www → domínio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.milararquitetura.com;
    include /etc/nginx/snippets/milar-tls.conf;
    return 301 https://milararquitetura.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name milararquitetura.com;
    include /etc/nginx/snippets/milar-tls.conf;

    # Defesa extra: mesmo que a conexão TLS tenha sido aberta com o SNI de
    # outro site da VPS, uma requisição com Host do Milar sem o certificado
    # do Cloudflare é barrada aqui.
    if ($ssl_client_verify != SUCCESS) {
        return 403;
    }

    # IP real do visitante: só aceito o CF-Connecting-IP vindo das faixas do
    # Cloudflare (https://www.cloudflare.com/ips/). O app recebe em X-Real-IP
    # e usa no rate limit do login e dos depoimentos.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    server_tokens off;

    # Upload de foto do admin: 15 MB + folga do multipart.
    client_max_body_size 20m;
    client_body_timeout 60s;
    client_header_timeout 10s;

    access_log /var/log/nginx/milar.access.log;
    error_log  /var/log/nginx/milar.error.log warn;

    # Arquivos ocultos e dumps nunca são servidos.
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(sql|bak|dump)$ { return 404; }

    location / {
        proxy_pass http://milar_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # $remote_addr já é o IP real (módulo realip acima); sobrescreve
        # qualquer X-Real-IP / X-Forwarded-For que o cliente tenha mandado.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # A home chega por streaming (Suspense); sem buffer ela aparece aos poucos.
        proxy_buffering off;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
