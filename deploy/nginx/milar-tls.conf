# /etc/nginx/snippets/milar-tls.conf
# TLS do Milar: Cloudflare Origin Certificate + Authenticated Origin Pulls
# (mTLS). Só o Cloudflare tem o certificado de cliente aceito aqui, então
# acessar o IP da VPS direto com o domínio do Milar é recusado.
# Vale só para os server blocks do Milar; o outro site da VPS não é afetado.

ssl_certificate         /etc/milar/certs/origin.pem;
ssl_certificate_key     /etc/milar/certs/origin.key;
ssl_client_certificate  /etc/milar/certs/cloudflare-origin-pull-ca.pem;
ssl_verify_client       on;
ssl_protocols           TLSv1.2 TLSv1.3;
