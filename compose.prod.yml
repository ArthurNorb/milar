# Produção (VPS Oracle). Use sempre via deploy/deploy.sh, que passa
# --env-file .env.production. O app só escuta em 127.0.0.1:APP_PORT (padrão
# 3010) e o Nginx do host faz HTTPS + Cloudflare; o banco fica numa rede
# interna do Docker, sem porta publicada.
name: milar

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: milar
      POSTGRES_DB: milar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
        -c max_connections=30
        -c shared_buffers=256MB
        -c password_encryption=scram-sha-256
        -c log_connections=off
    shm_size: 128mb
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milar -d milar"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgres://milar:${POSTGRES_PASSWORD}@db:5432/milar
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  app:
    <<: *hardening
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?defina NEXT_PUBLIC_SITE_URL}
    image: milar-app:latest
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://milar:${POSTGRES_PASSWORD}@db:5432/milar
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - next-cache:/app/.next/cache
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Só no loopback: quem fala com a internet é o Nginx do host
      # (deploy/nginx/milar.conf). Nada de 0.0.0.0 aqui.
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    networks:
      - backend
      - frontend

networks:
  # Sem saída para a internet: só app ↔ db.
  backend:
    internal: true
  frontend:

volumes:
  db-data:
  uploads:
  next-cache:
